spring.application.name=musical-reviews-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/avaliacao_musical}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploying-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
springdoc.swagger-ui.path=/swagger-ui.html
